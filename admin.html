<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin · Botines Alta Gama CBA</title>
<style>
:root{
  --bg:#0a0a0a;--bg2:#111;--bg3:#161616;--bg4:#1e1e1e;
  --fg:#fff;--fg2:#ccc;--muted:#888;--faint:#444;
  --line:#222;--line2:#333;
  --accent:#fff;--accent-fg:#000;
  --green:#4ade80;--red:#ef4444;--yellow:#facc15;--blue:#60a5fa;
  --r:0;--dur:180ms;
  --font:'Inter','Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;height:100%}
a{color:inherit;text-decoration:none}
button{font-family:var(--font);cursor:pointer}
input,select,textarea{font-family:var(--font);background:var(--bg3);color:var(--fg);border:1px solid var(--line2);border-radius:4px;padding:10px 12px;font-size:13px;width:100%;outline:none;transition:border-color var(--dur)}
input:focus,select:focus,textarea:focus{border-color:var(--fg)}
textarea{resize:vertical;min-height:80px}
select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' fill='%23888'><path d='M0 0l5 6 5-6z'/></svg>");background-repeat:no-repeat;background-position:right 10px center}
label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.hidden{display:none!important}

/* ─── LAYOUT ─── */
#app{display:flex;height:100vh;overflow:hidden}

/* ─── SIDEBAR ─── */
.sidebar{width:220px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow-y:auto}
.sidebar-brand{padding:20px 18px;border-bottom:1px solid var(--line)}
.sidebar-brand h1{font-size:11px;font-weight:700;letter-spacing:.2em;color:var(--muted)}
.sidebar-brand p{font-size:13px;font-weight:600;margin-top:4px}
.sidebar-nav{flex:1;padding:12px 0}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 18px;font-size:13px;font-weight:500;cursor:pointer;border:0;background:transparent;color:var(--fg2);width:100%;text-align:left;transition:background var(--dur),color var(--dur)}
.nav-item:hover{background:var(--bg3);color:var(--fg)}
.nav-item.active{background:var(--bg3);color:var(--fg);border-left:2px solid var(--accent)}
.nav-item svg{opacity:.6;flex-shrink:0}
.nav-item.active svg{opacity:1}
.sidebar-foot{padding:14px 18px;border-top:1px solid var(--line)}
.btn-logout{width:100%;padding:10px;background:transparent;border:1px solid var(--line2);color:var(--muted);font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;transition:border-color var(--dur),color var(--dur)}
.btn-logout:hover{border-color:var(--red);color:var(--red)}

/* ─── MAIN ─── */
.main{flex:1;overflow-y:auto;background:var(--bg)}
.section{padding:32px;min-height:100%}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;gap:16px;flex-wrap:wrap}
.section-title{font-size:22px;font-weight:700}
.section-subtitle{font-size:13px;color:var(--muted);margin-top:4px}

/* ─── BUTTONS ─── */
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;border:0;transition:opacity var(--dur)}
.btn:hover{opacity:.8}
.btn-primary{background:var(--fg);color:var(--accent-fg)}
.btn-ghost{background:transparent;border:1px solid var(--line2);color:var(--fg2)}
.btn-ghost:hover{border-color:var(--fg);color:var(--fg);opacity:1}
.btn-danger{background:var(--red);color:#fff}
.btn-sm{padding:6px 12px;font-size:11px}
.btn-icon{padding:7px;background:transparent;border:1px solid var(--line2);color:var(--muted)}
.btn-icon:hover{border-color:var(--fg);color:var(--fg);opacity:1}

/* ─── TABLE ─── */
.table-wrap{overflow-x:auto;border:1px solid var(--line);margin-top:8px}
table{width:100%;border-collapse:collapse}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
th{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--bg2)}
tr:last-child td{border-bottom:0}
tr:hover td{background:var(--bg2)}
td.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.badge{display:inline-flex;align-items:center;padding:3px 8px;font-size:10px;font-weight:600;letter-spacing:.08em;border:1px solid var(--line2);color:var(--muted)}
.badge.green{border-color:var(--green);color:var(--green)}
.badge.red{border-color:var(--red);color:var(--red)}

/* ─── MODAL ─── */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:24px;overflow-y:auto}
.modal-card{background:var(--bg2);border:1px solid var(--line2);width:100%;max-width:780px;margin:auto;animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--line)}
.modal-head h2{font-size:16px;font-weight:700}
.modal-body{padding:24px;display:flex;flex-direction:column;gap:20px}
.modal-foot{padding:16px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:12px}

/* ─── FORM ─── */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-grid.cols3{grid-template-columns:1fr 1fr 1fr}
.form-full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:6px}
.field-hint{font-size:11px;color:var(--muted);margin-top:4px}
.check-row{display:flex;align-items:center;gap:10px;cursor:pointer}
.check-row input[type=checkbox]{width:auto;cursor:pointer;accent-color:var(--accent)}

/* ─── BLOCK EDITOR ─── */
.block-editor{border:1px solid var(--line2);background:var(--bg3)}
.block-editor-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.block-editor-head span{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.block-list{display:flex;flex-direction:column;gap:0}
.block-item{border-bottom:1px solid var(--line);background:var(--bg2)}
.block-item:last-child{border-bottom:0}
.block-header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.block-type-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);flex:1}
.block-controls{display:flex;gap:6px}
.block-body{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.block-add-bar{padding:12px 16px;display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line2);background:var(--bg3)}
.block-add-bar span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);align-self:center;margin-right:4px}

/* ─── SIZES GRID ─── */
.sizes-grid{display:flex;flex-wrap:wrap;gap:8px}
.size-toggle{padding:8px 12px;border:1px solid var(--line2);background:transparent;color:var(--muted);font-size:12px;font-weight:500;cursor:pointer;transition:all var(--dur);min-width:48px;text-align:center}
.size-toggle.on{border-color:var(--fg);background:var(--fg);color:var(--accent-fg)}
.size-toggle:hover{border-color:var(--fg2)}

/* ─── IMAGES LIST ─── */
.images-list{display:flex;flex-direction:column;gap:8px}
.image-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.img-preview{width:48px;height:48px;object-fit:contain;background:#000;border:1px solid var(--line2);display:block}

/* ─── COLOR SWATCH ─── */
.color-preview{width:20px;height:20px;border-radius:50%;border:1px solid var(--line2);display:inline-block;flex-shrink:0}

/* ─── LOGIN ─── */
#login-screen{display:flex;align-items:center;justify-content:center;height:100vh;background:var(--bg)}
.login-card{background:var(--bg2);border:1px solid var(--line);padding:40px;width:360px}
.login-card h1{font-size:11px;font-weight:700;letter-spacing:.25em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.login-card h2{font-size:24px;font-weight:700;margin-bottom:28px}
.login-form{display:flex;flex-direction:column;gap:16px}
.login-error{color:var(--red);font-size:12px;text-align:center;min-height:18px}

/* ─── ALERT ─── */
.alert{padding:12px 16px;font-size:12px;font-weight:500;letter-spacing:.04em;border-left:3px solid}
.alert-success{border-color:var(--green);background:rgba(74,222,128,.08);color:var(--green)}
.alert-error{border-color:var(--red);background:rgba(239,68,68,.08);color:var(--red)}

/* ─── MARCAS GRID ─── */
.brands-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.brand-card{border:1px solid var(--line);background:var(--bg2);overflow:hidden}
.brand-card-head{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid var(--line)}
.brand-card-name{font-size:15px;font-weight:700}
.brand-cover-preview{width:100%;height:120px;object-fit:cover;background:var(--bg3);display:block;border-bottom:1px solid var(--line)}
.brand-card-body{padding:16px;display:flex;flex-direction:column;gap:12px}
.models-list{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.model-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 10px;background:var(--bg3);border:1px solid var(--line)}
.model-row-name{font-size:12px;font-weight:600}
.model-img-preview{width:36px;height:36px;object-fit:contain;background:#000;display:block;border:1px solid var(--line)}

/* ─── CONFIG ─── */
.config-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:600px}
.config-card{border:1px solid var(--line);padding:20px;background:var(--bg2)}
.config-card h3{font-size:13px;font-weight:700;margin-bottom:4px}
.config-card p{font-size:12px;color:var(--muted);margin-bottom:14px}

/* ─── RESPONSIVE ─── */
@media(max-width:700px){
  .sidebar{display:none}
  .form-grid,.form-grid.cols3{grid-template-columns:1fr}
  .config-grid{grid-template-columns:1fr}
}

/* ─── TOAST ─── */
.toast{position:fixed;bottom:24px;right:24px;z-index:999;padding:12px 20px;background:var(--bg2);border:1px solid var(--line2);font-size:13px;font-weight:500;animation:fadeIn .2s ease}
.toast.ok{border-color:var(--green);color:var(--green)}
.toast.err{border-color:var(--red);color:var(--red)}
</style>
</head>
<body>

<!-- ══════════════ LOGIN ══════════════ -->
<div id="login-screen">
  <div class="login-card">
    <h1>Botines Alta Gama CBA</h1>
    <h2>Panel de Admin</h2>
    <form class="login-form" id="loginForm" onsubmit="doLogin(event)">
      <div class="field"><label>Usuario</label><input id="loginUser" type="text" required autocomplete="username"></div>
      <div class="field"><label>Contraseña</label><input id="loginPass" type="password" required autocomplete="current-password"></div>
      <div class="login-error" id="loginError"></div>
      <button type="submit" class="btn btn-primary" style="margin-top:4px">INGRESAR</button>
    </form>
  </div>
</div>

<!-- ══════════════ APP ══════════════ -->
<div id="app" class="hidden">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <h1>ADMIN PANEL</h1>
      <p>Botines Alta Gama</p>
    </div>
    <nav class="sidebar-nav">
      <button class="nav-item active" onclick="showSection('lanzamientos')">
        <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M4 6h8M4 10h6M4 14h4"/><rect x="1" y="2" width="14" height="15" rx="1"/></svg>
        Lanzamientos
      </button>
      <button class="nav-item" onclick="showSection('stock')">
        <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M8 1L1 5v6l7 4 7-4V5L8 1z"/><path d="M1 5l7 4 7-4M8 9v6"/></svg>
        Stock
      </button>
      <button class="nav-item" onclick="showSection('marcas')">
        <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="1.5"><circle cx="8" cy="8" r="7"/><path d="M5 8h6M8 5l3 3-3 3"/></svg>
        Marcas y Modelos
      </button>
      <button class="nav-item" onclick="showSection('config')">
        <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="1.5"><circle cx="8" cy="8" r="3"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.2 3.2l1.4 1.4M11.4 11.4l1.4 1.4M3.2 12.8l1.4-1.4M11.4 4.6l1.4-1.4"/></svg>
        Configuración
      </button>
    </nav>
    <div class="sidebar-foot">
      <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
    </div>
  </aside>

  <!-- Main -->
  <main class="main" id="mainArea">

    <!-- ── LANZAMIENTOS ── -->
    <div id="sec-lanzamientos" class="section">
      <div class="section-head">
        <div>
          <div class="section-title">Lanzamientos</div>
          <div class="section-subtitle">Artículos editoriales, noticias y campañas</div>
        </div>
        <button class="btn btn-primary" onclick="openArticleModal()">+ Nuevo lanzamiento</button>
      </div>
      <div id="articles-table"></div>
    </div>

    <!-- ── STOCK ── -->
    <div id="sec-stock" class="section hidden">
      <div class="section-head">
        <div>
          <div class="section-title">Stock</div>
          <div class="section-subtitle">Productos disponibles en el catálogo</div>
        </div>
        <button class="btn btn-primary" onclick="openProductModal()">+ Agregar producto</button>
      </div>
      <div style="display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap">
        <div class="field" style="min-width:180px;margin:0"><label>Marca</label>
          <select id="filterBrand" onchange="loadProducts()"><option value="">Todas las marcas</option></select>
        </div>
        <div class="field" style="min-width:180px;margin:0"><label>Modelo</label>
          <select id="filterModel" onchange="loadProducts()"><option value="">Todos los modelos</option></select>
        </div>
      </div>
      <div id="products-table"></div>
    </div>

    <!-- ── MARCAS ── -->
    <div id="sec-marcas" class="section hidden">
      <div class="section-head">
        <div>
          <div class="section-title">Marcas y Modelos</div>
          <div class="section-subtitle">Imágenes de portada, logos y fotos de modelo</div>
        </div>
      </div>
      <div id="brands-grid" class="brands-grid"></div>
    </div>

    <!-- ── CONFIG ── -->
    <div id="sec-config" class="section hidden">
      <div class="section-head">
        <div class="section-title">Configuración</div>
      </div>
      <div class="config-grid" id="config-area"></div>
    </div>

  </main>
</div>

<!-- ══════════════ MODAL ══════════════ -->
<div id="modal" class="modal-backdrop hidden" onclick="maybeCloseModal(event)">
  <div class="modal-card" onclick="event.stopPropagation()">
    <div class="modal-head">
      <h2 id="modal-title">Modal</h2>
      <button class="btn btn-ghost btn-sm" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot" id="modal-foot"></div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script>
/* ══════════════════════════════════════
   STATE
══════════════════════════════════════ */
let TOKEN = localStorage.getItem('bag_admin_token') || '';
let BRANDS = [];      // [{ slug, name, models:[...] }]
let ARTICLES = [];
let CURRENT_BLOCKS = [];   // article block editor state
let EDITING_ID = null;     // article or product id being edited

/* ══════════════════════════════════════
   API HELPER
══════════════════════════════════════ */
async function api(method, path, body) {
  const opts = {
    method,
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${TOKEN}` },
  };
  if (body !== undefined) opts.body = JSON.stringify(body);
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}
const GET  = (p)    => api('GET',    p);
const POST = (p, b) => api('POST',   p, b);
const PUT  = (p, b) => api('PUT',    p, b);
const DEL  = (p)    => api('DELETE', p);

/* ══════════════════════════════════════
   AUTH
══════════════════════════════════════ */
async function doLogin(e) {
  e.preventDefault();
  document.getElementById('loginError').textContent = '';
  const username = document.getElementById('loginUser').value;
  const password = document.getElementById('loginPass').value;
  try {
    const { token } = await POST('/api/admin/login', { username, password });
    TOKEN = token;
    localStorage.setItem('bag_admin_token', token);
    showApp();
  } catch(err) {
    document.getElementById('loginError').textContent = err.message;
  }
}
function logout() {
  TOKEN = '';
  localStorage.removeItem('bag_admin_token');
  document.getElementById('app').classList.add('hidden');
  document.getElementById('login-screen').classList.remove('hidden');
}
async function showApp() {
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  await Promise.all([loadBrands(), loadArticles()]);
  renderArticlesTable();
  populateBrandFilter();
}

/* ══════════════════════════════════════
   INIT
══════════════════════════════════════ */
window.addEventListener('DOMContentLoaded', async () => {
  if (!TOKEN) return;
  try {
    await GET('/api/admin/verify');
    showApp();
  } catch { TOKEN = ''; localStorage.removeItem('bag_admin_token'); }
});

/* ══════════════════════════════════════
   NAVIGATION
══════════════════════════════════════ */
function showSection(id) {
  ['lanzamientos','stock','marcas','config'].forEach(s => {
    document.getElementById(`sec-${s}`).classList.toggle('hidden', s !== id);
  });
  document.querySelectorAll('.nav-item').forEach((el, i) => {
    el.classList.toggle('active', ['lanzamientos','stock','marcas','config'][i] === id);
  });
  if (id === 'stock')    { loadProducts(); }
  if (id === 'marcas')   { renderBrandsGrid(); }
  if (id === 'config')   { renderConfig(); }
}

/* ══════════════════════════════════════
   MODAL
══════════════════════════════════════ */
function openModal(title, bodyHTML, footHTML) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = bodyHTML;
  document.getElementById('modal-foot').innerHTML = footHTML;
  document.getElementById('modal').classList.remove('hidden');
}
function closeModal() {
  document.getElementById('modal').classList.add('hidden');
  CURRENT_BLOCKS = [];
  EDITING_ID = null;
}
function maybeCloseModal(e) {
  if (e.target === document.getElementById('modal')) closeModal();
}

/* ══════════════════════════════════════
   TOAST
══════════════════════════════════════ */
let _toastTimer;
function toast(msg, type = 'ok') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `toast ${type}`;
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.add('hidden'), 3000);
}

/* ══════════════════════════════════════
   LOADERS
══════════════════════════════════════ */
async function loadBrands() {
  BRANDS = await GET('/api/marcas');
}
async function loadArticles() {
  ARTICLES = await GET('/api/lanzamientos');
}

/* ══════════════════════════════════════
   ─── LANZAMIENTOS ───
══════════════════════════════════════ */
function renderArticlesTable() {
  const el = document.getElementById('articles-table');
  if (!ARTICLES.length) {
    el.innerHTML = '<div style="padding:40px;text-align:center;color:var(--muted)">No hay lanzamientos aún.</div>';
    return;
  }
  el.innerHTML = `
    <div class="table-wrap">
    <table>
      <thead><tr>
        <th>#</th><th>Título</th><th>Marca</th><th>Categoría</th><th>Fecha</th>
        <th>Visible</th><th>Pos.</th><th>Acciones</th>
      </tr></thead>
      <tbody>
        ${ARTICLES.map(a => `
          <tr>
            <td style="color:var(--faint);font-size:11px">${a.id}</td>
            <td>
              <div style="font-weight:600;max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${a.title}</div>
              <div style="font-size:11px;color:var(--muted);margin-top:2px">${a.slug}</div>
            </td>
            <td>${a.brand || '—'}</td>
            <td><span class="badge">${a.category || ''}</span></td>
            <td style="white-space:nowrap">${a.date || '—'}</td>
            <td>${a.show_on_home ? '<span class="badge green">Sí</span>' : '<span class="badge">No</span>'}</td>
            <td style="text-align:center">${a.home_position}</td>
            <td class="actions">
              <button class="btn btn-ghost btn-sm" onclick="openArticleModal(${a.id})">Editar</button>
              <button class="btn btn-danger btn-sm" onclick="deleteArticle(${a.id},'${a.title.replace(/'/g,"\\'")}')">Eliminar</button>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>
    </div>`;
}

/* Article modal */
function openArticleModal(id = null) {
  EDITING_ID = id;
  const art = id ? ARTICLES.find(a => a.id === id) : null;
  CURRENT_BLOCKS = art && Array.isArray(art.body) ? JSON.parse(JSON.stringify(art.body)) : [];

  const html = `

/* Block editor */
function renderBlockList() {
  const el = document.getElementById('block-list');
  if (!el) return;
  if (!CURRENT_BLOCKS.length) {
    el.innerHTML = '<div style="padding:24px;text-align:center;color:var(--muted);font-size:12px">Sin bloques. Agrega un párrafo, imagen o embed de Instagram.</div>';
    document.querySelector('.block-editor-head span:last-child').textContent = '0 bloques';
    return;
  }
  document.querySelector('.block-editor-head span:last-child').textContent = `${CURRENT_BLOCKS.length} bloques`;
  el.innerHTML = CURRENT_BLOCKS.map((b, i) => renderBlockItem(b, i)).join('');
}

function renderBlockItem(b, i) {
  const up   = i > 0 ? `<button class="btn btn-icon btn-sm" title="Subir" onclick="moveBlock(${i},-1)">↑</button>` : '';
  const down = i < CURRENT_BLOCKS.length-1 ? `<button class="btn btn-icon btn-sm" title="Bajar" onclick="moveBlock(${i},1)">↓</button>` : '';
  const del  = `<button class="btn btn-icon btn-sm" title="Eliminar" onclick="removeBlock(${i})" style="color:var(--red)">✕</button>`;

  const typeLabels = { paragraph:'PÁRRAFO', image:'IMAGEN', instagram:'INSTAGRAM', row:'2 COLUMNAS' };
  const head = `<div class="block-header"><span class="block-type-label">${typeLabels[b.type]||b.type}</span><div class="block-controls">${up}${down}${del}</div></div>`;

  let body = '';
  if (b.type === 'paragraph') {
    body = `<div class="block-body">
      <div class="field"><label>Texto del párrafo</label>
        <textarea rows="4" onchange="updateBlock(${i},'text',this.value)" oninput="updateBlock(${i},'text',this.value)">${esc(b.text||'')}</textarea>
      </div></div>`;
  }
  if (b.type === 'image') {
    body = `<div class="block-body">
      <div class="form-grid">
        <div class="field form-full">
          <label>URL de la imagen</label>
          <input value="${esc(b.url||'')}" onchange="updateBlock(${i},'url',this.value)" placeholder="https://...">
        </div>
        <div class="field"><label>Ancho (px)</label><input type="number" value="${b.width||1080}" onchange="updateBlock(${i},'width',+this.value)"></div>
        <div class="field"><label>Alto (px)</label><input type="number" value="${b.height||1350}" onchange="updateBlock(${i},'height',+this.value)"></div>
        <div class="field">
          <label>Tamaño en pantalla</label>
          <select onchange="updateBlock(${i},'display',this.value)">
            <option value="full" ${(b.display||'full')==='full'?'selected':''}>Full width (100%)</option>
            <option value="half" ${b.display==='half'?'selected':''}>Mitad (50%)</option>
            <option value="breakout" ${b.display==='breakout'?'selected':''}>Breakout (fuera del margen)</option>
          </select>
        </div>
        <div class="field form-full"><label>Epígrafe / Pie de foto</label>
          <input value="${esc(b.caption||'')}" onchange="updateBlock(${i},'caption',this.value)" placeholder="Opcional">
        </div>
      </div></div>`;
  }
  if (b.type === 'instagram') {
    body = `<div class="block-body">
      <div class="form-grid">
        <div class="field form-full">
          <label>URL del post de Instagram</label>
          <input value="${esc(b.url||'')}" onchange="updateBlock(${i},'url',this.value)" placeholder="https://www.instagram.com/p/POST_ID/">
          <div class="field-hint">Pegá la URL completa del post. El embed se genera automáticamente.</div>
        </div>
        <div class="field">
          <label>Tamaño en pantalla</label>
          <select onchange="updateBlock(${i},'display',this.value)">
            <option value="full" ${(b.display||'full')==='full'?'selected':''}>Full width</option>
            <option value="half" ${b.display==='half'?'selected':''}>Mitad (centrado)</option>
          </select>
        </div>
      </div></div>`;
  }
  if (b.type === 'row') {
    body = `<div class="block-body">
      <p style="font-size:12px;color:var(--muted);margin-bottom:12px">Dos columnas lado a lado. Cada columna puede ser imagen o Instagram.</p>
      <div class="form-grid">
        <div>
          <label style="margin-bottom:8px">Columna izquierda</label>
          ${renderSubBlockFields(b.left||{type:'image'}, i, 'left')}
        </div>
        <div>
          <label style="margin-bottom:8px">Columna derecha</label>
          ${renderSubBlockFields(b.right||{type:'image'}, i, 'right')}
        </div>
      </div></div>`;
  }
  return `<div class="block-item">${head}${body}</div>`;
}

function renderSubBlockFields(sub, blockIdx, side) {
  return `
    <div class="field"><label>Tipo</label>
      <select onchange="updateSubBlock(${blockIdx},'${side}','type',this.value)">
        <option value="image"     ${(sub.type||'image')==='image'?'selected':''}>Imagen</option>
        <option value="instagram" ${sub.type==='instagram'?'selected':''}>Instagram</option>
      </select>
    </div>
    <div class="field" style="margin-top:8px"><label>URL</label>
      <input value="${esc(sub.url||'')}" onchange="updateSubBlock(${blockIdx},'${side}','url',this.value)" placeholder="https://...">
    </div>
    ${sub.type !== 'instagram' ? `<div class="field" style="margin-top:8px"><label>Epígrafe</label>
      <input value="${esc(sub.caption||'')}" onchange="updateSubBlock(${blockIdx},'${side}','caption',this.value)" placeholder="Opcional"></div>` : ''}
  `;
}

function addBlock(type) {
  const defaults = {
    paragraph: { type:'paragraph', text:'' },
    image:     { type:'image', url:'', width:1080, height:1350, display:'full', caption:'' },
    instagram: { type:'instagram', url:'', display:'full' },
    row:       { type:'row', left:{type:'image',url:''}, right:{type:'image',url:''} },
  };
  CURRENT_BLOCKS.push({ ...defaults[type] });
  renderBlockList();
}
function removeBlock(i) {
  CURRENT_BLOCKS.splice(i, 1);
  renderBlockList();
}
function moveBlock(i, dir) {
  const j = i + dir;
  if (j < 0 || j >= CURRENT_BLOCKS.length) return;
  [CURRENT_BLOCKS[i], CURRENT_BLOCKS[j]] = [CURRENT_BLOCKS[j], CURRENT_BLOCKS[i]];
  renderBlockList();
}
function updateBlock(i, key, val) {
  CURRENT_BLOCKS[i][key] = val;
  // Don't re-render to preserve cursor position
}
function updateSubBlock(i, side, key, val) {
  if (!CURRENT_BLOCKS[i][side]) CURRENT_BLOCKS[i][side] = { type: 'image', url: '' };
  CURRENT_BLOCKS[i][side][key] = val;
  if (key === 'type') renderBlockList(); // re-render to show/hide fields
}

async function saveArticle() {
  const get = id => document.getElementById(id);
  const title    = get('a-title').value.trim();
  const slug     = get('a-slug').value.trim();
  if (!title || !slug) return toast('Título y slug son obligatorios', 'err');

  let related = null;
  const relVal = get('a-related').value.trim();
  if (relVal) try { related = JSON.parse(relVal); } catch { return toast('JSON de producto relacionado inválido', 'err'); }

  const payload = {
    title, slug,
    subtitle:      get('a-subtitle').value.trim() || null,
    excerpt:       get('a-excerpt').value.trim() || null,
    brand:         get('a-brand').value || null,
    category:      get('a-category').value,
    date:          get('a-date').value.trim() || null,
    cover:         get('a-cover').value.trim() || null,
    featured:      get('a-featured').checked,
    show_on_home:  get('a-show').checked,
    home_position: parseInt(get('a-pos').value) || 0,
    body:          CURRENT_BLOCKS,
    related_product: related,
  };

  try {
    if (EDITING_ID) {
      await PUT(`/api/lanzamientos/${EDITING_ID}`, payload);
      toast('Lanzamiento actualizado');
    } else {
      await POST('/api/lanzamientos', payload);
      toast('Lanzamiento creado');
    }
    closeModal();
    await loadArticles();
    renderArticlesTable();
  } catch(err) {
    toast(err.message, 'err');
  }
}

async function deleteArticle(id, title) {
  if (!confirm(`¿Eliminar "${title}"?`)) return;
  try {
    await DEL(`/api/lanzamientos/${id}`);
    toast('Eliminado');
    await loadArticles();
    renderArticlesTable();
  } catch(err) {
    toast(err.message, 'err');
  }
}

async function saveProduct() {
  const brand_slug = document.getElementById('p-brand').value;
  const model_slug = document.getElementById('p-model').value;
  const name       = document.getElementById('p-name').value.trim();
  if (!brand_slug || !model_slug || !name) return toast('Marca, modelo y nombre son obligatorios', 'err');

  // Collect available sizes
  const available_sizes = [...document.querySelectorAll('#p-sizes-grid .size-toggle.on')].map(b => b.dataset.sz);

  // Build sizes object (full EU/US/UK maps)
  const euIdx = available_sizes.map(sz => EU_SIZES.indexOf(sz)).filter(i => i >= 0);
  const maxIdx = euIdx.length ? Math.max(...euIdx) : EU_SIZES.length - 1;
  const minIdx = euIdx.length ? Math.min(...euIdx) : 0;
  const sizes = {
    eu: EU_SIZES.slice(Math.max(0, minIdx - 1), maxIdx + 2),
    us: US_SIZES.slice(Math.max(0, minIdx - 1), maxIdx + 2),
    uk: UK_SIZES.slice(Math.max(0, minIdx - 1), maxIdx + 2),
  };

  const images = (window._productImages || []).filter(u => u.trim());
  const color  = document.getElementById('p-color').value;

  const payload = {
    brand_slug, model_slug, name,
    colorway:       document.getElementById('p-colorway').value.trim() || null,
    color,
    price:          parseInt(document.getElementById('p-price').value) || 0,
    sizes,
    available_sizes,
    images,
    spec: {
      suela:    document.getElementById('p-suela').value.trim(),
      terreno:  document.getElementById('p-terreno').value.trim(),
      peso:     document.getElementById('p-peso').value.trim(),
      coleccion:document.getElementById('p-coleccion').value.trim(),
    },
  };

  try {
    if (EDITING_ID) {
      await PUT(`/api/stock/${EDITING_ID}`, payload);
      toast('Producto actualizado');
    } else {
      await POST('/api/stock', payload);
      toast('Producto creado');
    }
    closeModal();
    await loadProducts();
  } catch(err) {
    toast(err.message, 'err');
  }
}

async function deleteProduct(id, name) {
  if (!confirm(`¿Eliminar "${name}"?`)) return;
  try {
    await DEL(`/api/stock/${id}`);
    toast('Eliminado');
    await loadProducts();
  } catch(err) {
    toast(err.message, 'err');
  }
}

/* ══════════════════════════════════════
   ─── MARCAS ───
══════════════════════════════════════ */
function renderBrandsGrid() {
  const el = document.getElementById('brands-grid');
  el.innerHTML = BRANDS.map(b => `
    <div class="brand-card">
      <div class="brand-card-head">
        <span class="brand-card-name">${b.name}</span>
        <button class="btn btn-ghost btn-sm" onclick="openBrandModal('${b.slug}')">Editar</button>
      </div>
      ${b.cover ? `<img class="brand-cover-preview" src="${esc(b.cover)}" onerror="this.style.opacity=.2">` : '<div class="brand-cover-preview" style="opacity:.1;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px">Sin imagen</div>'}
      <div class="brand-card-body">
        <div style="font-size:11px;color:var(--muted)">MODELOS</div>
        <div class="models-list">
          ${b.models.map(m => `
            <div class="model-row">
              <div>
                <div class="model-row-name">${m.name}</div>
                <div style="font-size:11px;color:var(--muted)">${m.tagline||''} · ${m.stock||0} productos</div>
              </div>
              <div style="display:flex;gap:6px;align-items:center">
                ${m.image ? `<img class="model-img-preview" src="${esc(m.image)}" onerror="this.style.opacity=.2">` : ''}
                <button class="btn btn-icon btn-sm" title="Editar modelo" onclick="openModelModal('${b.slug}','${m.slug}')">✎</button>
              </div>
            </div>`).join('')}
        </div>
      </div>
    </div>`).join('');
}

function openBrandModal(brandSlug) {
  const b = BRANDS.find(x => x.slug === brandSlug);
  openModal(`Editar marca: ${b.name}`, `
    <div class="form-grid">
      <div class="field form-full"><label>Nombre de la marca</label><input id="b-name" value="${esc(b.name)}"></div>
      <div class="field form-full"><label>Tagline</label><input id="b-tagline" value="${esc(b.tagline||'')}"></div>
      <div class="field form-full"><label>URL de imagen de portada</label>
        <input id="b-cover" value="${esc(b.cover||'')}" placeholder="https://...">
        <div class="field-hint">Imagen de fondo en la página de marcas</div>
      </div>
      <div class="field form-full"><label>URL del logo</label>
        <input id="b-logo" value="${esc(b.logo||'')}" placeholder="https://...">
        <div class="field-hint">Logo de la marca (opcional)</div>
      </div>
    </div>
    ${b.cover ? `<img src="${esc(b.cover)}" style="width:100%;height:120px;object-fit:cover;opacity:.6;border:1px solid var(--line);margin-top:8px" onerror="this.remove()">` : ''}
  `, `
    <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
    <button class="btn btn-primary" onclick="saveBrand('${brandSlug}')">GUARDAR</button>
  `);
}
async function saveBrand(slug) {
  try {
    await PUT(`/api/marcas/${slug}`, {
      name:    document.getElementById('b-name').value.trim(),
      tagline: document.getElementById('b-tagline').value.trim(),
      cover:   document.getElementById('b-cover').value.trim() || null,
      logo:    document.getElementById('b-logo').value.trim() || null,
    });
    toast('Marca actualizada');
    closeModal();
    await loadBrands();
    renderBrandsGrid();
  } catch(err) { toast(err.message, 'err'); }
}

function openModelModal(brandSlug, modelSlug) {
  const b = BRANDS.find(x => x.slug === brandSlug);
  const m = b?.models.find(x => x.slug === modelSlug);
  openModal(`Editar modelo: ${b.name} ${m.name}`, `
    <div class="form-grid">
      <div class="field"><label>Nombre</label><input id="m-name" value="${esc(m.name)}"></div>
      <div class="field"><label>Tagline</label><input id="m-tagline" value="${esc(m.tagline||'')}"></div>
      <div class="field form-full"><label>URL de imagen representativa</label>
        <input id="m-image" value="${esc(m.image||'')}" placeholder="https://...">
        <div class="field-hint">Imagen que aparece en la card del modelo (usa object-fit: contain sobre fondo negro)</div>
      </div>
    </div>
    ${m.image ? `<img src="${esc(m.image)}" style="max-height:140px;object-fit:contain;background:#000;border:1px solid var(--line);padding:16px;margin-top:8px;display:block" onerror="this.remove()">` : ''}
  `, `
    <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
    <button class="btn btn-primary" onclick="saveModel('${brandSlug}','${modelSlug}')">GUARDAR</button>
  `);
}
async function saveModel(brandSlug, modelSlug) {
  try {
    await PUT(`/api/marcas/${brandSlug}/modelos/${modelSlug}`, {
      name:    document.getElementById('m-name').value.trim(),
      tagline: document.getElementById('m-tagline').value.trim(),
      image:   document.getElementById('m-image').value.trim() || null,
    });
    toast('Modelo actualizado');
    closeModal();
    await loadBrands();
    renderBrandsGrid();
  } catch(err) { toast(err.message, 'err'); }
}

let _settings = {};
async function renderConfig() {
  try {
    _settings = await GET('/api/settings');
  } catch { _settings = {}; }

  document.getElementById('config-area').innerHTML = `
    <div class="config-card">
      <h3>Lanzamientos en home</h3>
      <p>Cantidad de artículos que aparecen en la página principal</p>
      <div class="field">
        <input type="number" id="cfg-home-articles" value="${_settings.home_articles_count||6}" min="1" max="20">
      </div>
    </div>
    <div class="config-card">
      <h3>Productos en home</h3>
      <p>Cantidad de productos del catálogo en el preview de la home</p>
      <div class="field">
        <input type="number" id="cfg-home-catalog" value="${_settings.home_catalog_count||4}" min="2" max="8">
      </div>
    </div>
    <div class="config-card" style="grid-column:1/-1">
      <button class="btn btn-primary" onclick="saveConfig()">GUARDAR CONFIGURACIÓN</button>
    </div>`;
}
async function saveConfig() {
  try {
    await PUT('/api/settings', {
      home_articles_count: document.getElementById('cfg-home-articles').value,
      home_catalog_count:  document.getElementById('cfg-home-catalog').value,
    });
    toast('Configuración guardada');
  } catch(err) { toast(err.message, 'err'); }
}

/* ══════════════════════════════════════
   UTILS
══════════════════════════════════════ */
function esc(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function slugify(str) {
  return str.toLowerCase().trim()
    .normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-z0-9\s-]/g,'').replace(/\s+/g,'-').replace(/-+/g,'-').slice(0,80);
}
