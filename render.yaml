## render.yaml — Configuración de infraestructura para Render
## Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: botines-alta-gama
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      - key: DB_PATH
        value: ./data/database.db

      # Estas las cargás manualmente en el dashboard de Render:
      - key: ADMIN_USERNAME
        sync: false

      - key: ADMIN_PASSWORD
        sync: false

      - key: JWT_SECRET
        sync: false

      # URL del frontend (Vercel u otro) — para CORS:
      - key: FRONTEND_URL
        sync: false
